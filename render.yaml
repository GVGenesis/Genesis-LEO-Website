# Optional Blueprint. You can also create the service by hand (see README).
databases:
  - name: genesis-db
    plan: free   # free databases expire; upgrade before then
services:
  - type: web
    name: Genesis-LEO-Website
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.7}
      - {key: DATABASE_URL, fromDatabase: {name: genesis-db, property: connectionString}}
      - {key: SESSION_SECRET, generateValue: true}
      - {key: PUBLIC_SERVICE_BOT_TOKEN, sync: false}
      - {key: DISCORD_CLIENT_ID, sync: false}
      - {key: DISCORD_CLIENT_SECRET, sync: false}
      - {key: OAUTH_REDIRECT_URI, sync: false}
      - {key: GUILD_ID, sync: false}
      - {key: LEO_ROLE_IDS, sync: false}
